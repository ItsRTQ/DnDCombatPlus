services:
  backend:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - .:/app
    # Install air for hot reloading and run it
    command: sh -c "go install github.com/air-verse/air@latest && air -c .air.toml"
    ports:
      - "8080:8080"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    # Install dependencies and run vite dev server
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
